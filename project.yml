name: FM1
options:
  bundleIdPrefix: com.oriol
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 37UF89K96Y
    CODE_SIGN_STYLE: Automatic
targets:
  FM1:
    type: application
    platform: iOS
    sources:
      - path: FM1
      # firmware packages shipped with the app (more can be installed at runtime)
      - path: Firmwares
        type: folder
        buildPhase: resources
      # static web tutorial, opened in the in-app browser
      - path: tutorial
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oriol.fm1pocket
        TARGETED_DEVICE_FAMILY: "2"
        INFOPLIST_FILE: FM1/App/Info.plist
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: FM1/App/Info.plist
      properties:
        CFBundleDisplayName: FM Pocket
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIAppFonts: [Orbitron.ttf, Nunito.ttf, ShareTech-Regular.ttf, Aldrich-Regular.ttf]
        NSBluetoothAlwaysUsageDescription: Connect Bluetooth MIDI keyboards and controllers.
        LSSupportsOpeningDocumentsInPlace: false
        UIFileSharingEnabled: true
        # firmware packages can be installed from a computer on the same network (plain http)
        NSAppTransportSecurity: {NSAllowsLocalNetworking: true}
        NSLocalNetworkUsageDescription: Download firmware packages from a computer on your network.
  FM1UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FM1UITests
    dependencies:
      - target: FM1
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "2"
schemes:
  FM1:
    build:
      targets:
        FM1: all
        FM1UITests: [test]
    test:
      targets:
        - FM1UITests
